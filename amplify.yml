version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci --include=dev
    build:
      commands:
        - npm run blog:build
        - npm run sitemap
        - ROLLUP_USE_NODEJS=true npx vite build
        - node scripts/buildIrpreneur2025.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  customRules:
    - source: '/google5f869c9128547998.html'
      target: '/google5f869c9128547998.html'
      status: '200'
  cache:
    paths:
      - node_modules/***
      - .npm/***
