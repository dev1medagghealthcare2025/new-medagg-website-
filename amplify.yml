version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci --include=dev
    build:
      commands:
        - npm run blog:build
        - npm run sitemap
        - ROLLUP_USE_NODEJS=true npx vite build
        - node scripts/buildIrpreneur2025.js
        - node scripts/ensureGoogleVerification.js
        - test -f dist/google5f869c9128547998.html
        - test "$(cat dist/google5f869c9128547998.html)" = "google-site-verification: google5f869c9128547998.html"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  customRules:
    - source: '/google5f869c9128547998.html'
      target: '/google5f869c9128547998.html'
      status: '200'
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|html|webp|xml)$)([^.]+$)/>'
      target: '/index.html'
      status: '200'
  cache:
    paths:
      - node_modules/***
      - .npm/***
